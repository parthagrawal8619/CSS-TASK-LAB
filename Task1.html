<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
        rel="stylesheet"
    >
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #F8FAFC;
        }

        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="max-w-[1200px] mx-auto px-6">
        <nav class="flex justify-between items-center h-[72px]">

            <span class="text-[14px] font-medium text-[#0F172A]">
                flowbase
            </span>
            <div class="hidden sm:flex items-center gap-4">
                <a href="#"
                   class="text-[14px] font-medium text-[#475569]">
                    Home
                </a>
                <a href="#"
                   class="text-[14px] font-medium text-[#475569]">
                    About Us
                </a>
                <a href="#"
                   class="text-[14px] font-medium text-[#475569]">
                    Contact Us
                </a>
                <a href="#"
                   class="text-[14px] font-medium text-[#475569]">
                    Help
                </a>
            </div>
            <button
                class="sm:hidden text-[#0F172A]"
                aria-label="menu">

                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">

                    <line
                        x1="3"
                        y1="6"
                        x2="21"
                        y2="6">
                    </line>

                    <line
                        x1="3"
                        y1="12"
                        x2="21"
                        y2="12">
                    </line>

                    <line
                        x1="3"
                        y1="18"
                        x2="21"
                        y2="18">
                    </line>

                </svg>

            </button>

        </nav>
        <div class="mt-20"></div>
        <section
            class="min-h-[520px] flex flex-col justify-center items-center sm:items-start text-center sm:text-left">

            <div class="max-w-[650px] w-full">
                <h1
                    class="text-[36px] sm:text-[48px] font-bold leading-[1.1] text-[#0F172A]">

                    Software-as-a-Service (SaaS)

                </h1>
                <p
                    class="mt-5 text-[18px] leading-[1.6] text-[#475569]">

                    Explore solutions to launch, manage, and grow your SaaS business.

                </p>

                <div class="mt-8 flex flex-col sm:flex-row gap-4">

                    <a
                        href="#"
                        class="inline-flex items-center justify-center px-6 py-3 text-[14px] font-medium text-white bg-[#4F46E5] hover:bg-[#4338CA]">
                        Login
                    </a>
                    <a
                        href="#"
                        class="inline-flex items-center justify-center px-6 py-3 text-[14px] font-medium text-[#0F172A] border border-[#E2E8F0] bg-white">

                        Explore

                    </a>

                </div>

            </div>

        </section>

        <h2
            class="text-[32px] font-bold text-[#0F172A]">

            Explore SaaS Solutions

        </h2>
        <div class="mt-12"></div>
        <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div
                class="bg-white border border-[#E2E8F0] p-6">

                <h3
                    class="text-[20px] font-semibold text-[#0F172A]">

                    SaaS Free Trials

                </h3>

            </div>
            <div
                class="bg-white border border-[#E2E8F0] p-6">

                <h3
                    class="text-[20px] font-semibold text-[#0F172A]">

                    Vendor Insights

                </h3>

            </div>

            <div
                class="bg-white border border-[#E2E8F0] p-6">

                <h3
                    class="text-[20px] font-semibold text-[#0F172A]">

                    SaaS Private Offers

                </h3>

            </div>

            <div
                class="bg-white border border-[#E2E8F0] p-6">

                <h3
                    class="text-[20px] font-semibold text-[#0F172A]">

                    SaaS Quick Launch

                </h3>

            </div>


        </div>

    </div>

</body>

</html>
