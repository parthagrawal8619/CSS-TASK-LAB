<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1%;
            grid-template-rows: auto;
            grid-template-areas: 
            "box1 box1 box2"
            "box3 box4 box4"
            "box5 box5 box5"
            "box6 box7 box8"
            "box6 box9 box9";     
    }
    @media(max-width: 500px){
        
    }
    .box{
        background-color: rgba(10, 164, 67, 0.359);
        min-height: 100px;
        color: rgb(4, 61, 111);
        font-size: 20px;
        text-align: center;      
    }
</style>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;">2</div>
        <div class="box" style="grid-area: box2;">3</div>
        <div class="box" style="grid-area: box3;">1</div>
        <div class="box" style="grid-area: box4;">4</div>
        <div class="box" style="grid-area: box5;">5</div>
        <div class="box" style="grid-area: box6;">6</div>
        <div class="box" style="grid-area: box7;">7</div>
        <div class="box" style="grid-area: box8;">8</div>
        <div class="box" style="grid-area: box9;">9</div>

    </div>
</body>
</html>
