<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            padding: 14px;
        }
        .box{
            width: 264px;
            height: 292px;
            background-color: #d9a441;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box img{
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="box"><img src="https://media.istockphoto.com/id/1381637603/photo/mountain-landscape.jpg?s=612x612&w=0&k=20&c=w64j3fW8C96CfYo3kbi386rs_sHH_6BGe8lAAAFS-y4="></div>
    <div class="box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgI3fF6_ebdidZr1lnTEvKusZLVuw2ZKsrhm_Xtxn6ZdQlOo9PBRq1v2VW&s=10"></div>
    <div class="box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7RZGDP99YIBabfgId41DtmLSeNNfUJekWreYsvsa7Yg&s"></div>
    <div class="box">Photo 4</div>
    <div class="box">Photo 5</div>
    <div class="box">Photo 6</div>
    <div class="box">Photo 7</div>
    <div class="box">Photo 8</div>
    <div class="box">Photo 9</div>
    <div class="box">Photo 10</div>
    <div class="box">Photo 11</div>
    <div class="box">Photo 12</div>
    <div class="box">Photo 13</div>
    <div class="box">Photo 14</div>
    <div class="box">Photo 15</div>
    <div class="box">Photo 16</div>
    <div class="box">Photo 17</div>
    <div class="box">Photo 18</div>
    <div class="box">Photo 19</div>
    <div class="box">Photo 20</div>

</body>
</html>
