<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Website</title>
    <style>
        body{
            background-color: #d8e2dc;
        }
        .container{
            display: flex;
            gap: 16px;
        }
        .cards{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            align-content: center;
            gap: 12px;
            padding: 16px;
            width: 146px;
            height: 178px;
            background-color: #fff8e7;
            border-radius: 10px;
        }
        img{
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; text-decoration: underline;">Product Cards</h1>
    <div class="container" >
        
        <div class="cards">
            <img width="130" height="120" src="https://img.magnific.com/premium-vector/mango-cartoon-style-vector-illustration_1044048-2047.jpg?semt=ais_hybrid&w=740&q=80">
            <p>Mango</p>
        </div>
        <div class="cards">
            <img width="130" height="120" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_TkNu26jKDazYGad34Jl8FA6FEWBqwzpp1tV4bn1ncaCP9jnko_XdsGn4zwoKLX_j7dN_2OD6FMt6hiqWHhOmbX03gMJ8gR9kkZ7iVw&s=10">
            <p>Strawberry</p>
        </div>
        <div class="cards">
            <img width="130" height="120" src="https://media.istockphoto.com/id/157197337/photo/blueberries.jpg?s=612x612&w=0&k=20&c=wsaP1C6PPoIrlAPX-Zbi8uwmOUp08oVB02pY5kjf39U=">
            <p>Blueberry</p>
        </div>
        <div class="cards">
            <img width="130" height="120" src="https://cdn.mos.cms.futurecdn.net/xCZ2VwHz6pDUHCSVvaQsDT-1200-80.jpg">
            <p>Orange</p>
        </div>
    </div>
</body>
</html>
