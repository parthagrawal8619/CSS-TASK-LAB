<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        .container{
            background:rgb(0, 0, 0);
            height:60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 40px;
            
        }

        .logo{
            color:rgb(167, 8, 8);
            font-size:24px;
            font-weight:bold;
        }

        ul{
            list-style:none;
            display:flex;
            gap:30px;
        }

        a{
            color:rgb(225, 214, 223);
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">GLA University</div>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Reviews</a></li>
        <li><a href="#">Contact </a></li>
        <li><a href="#">Login</a></li>
    </ul>
</nav>

</body>
</html>
